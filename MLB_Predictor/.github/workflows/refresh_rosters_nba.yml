name: Refresh NBA Rosters

on:
  schedule:
    # 10:10 UTC nightly - clear of the MLB jobs at 09:20 and 11:40
    - cron: "10 10 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Pull rosters
        run: python refresh_rosters_nba.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add NBA_Predictor/nba_roster_data.json
          if git diff --staged --quiet; then
            echo "No roster changes."
          else
            git commit -m "Auto-update NBA rosters $(date -u +%Y-%m-%d)"
            git push
          fi

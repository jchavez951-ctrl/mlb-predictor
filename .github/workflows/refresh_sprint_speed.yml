name: Nightly Sprint Speed Refresh

on:
  schedule:
    - cron: "20 9 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Run sprint speed refresh
        run: python MLB_Predictor/refresh_sprint_speed.py

      - name: Commit and push updated sprint speed data
        run: |
          git config user.name "sprint-speed-refresh-bot"
          git config user.email "actions@github.com"
          git add MLB_Predictor/sprint_speed.json
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "Automated nightly sprint speed refresh"
          git push

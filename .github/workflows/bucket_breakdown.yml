name: Bucket Breakdown
on:
  workflow_dispatch:
jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run bucket breakdown
        run: python MLB_Predictor/bucket_breakdown.py
